<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inscription à l'étude</title>
<!-- <link rel="icon" href="icone.png"> : décommentez et ajoutez une image icone.png pour l'icône d'onglet -->
<style>
:root{
  /* Couleurs reprises de votre page de résultats (choice_vs_profile_results.html) */
  --bg:#faf9f1; --surface:#ffffff; --sunk:#f0ece4; --line:#e7e2d8; --fg:#141414; --muted:#8a8478; --cap:#3d3826;
  --accent:#cb6441; --accent-fg:#ffffff; --accent-l:#f6eade; --ok:#2e7d4f; --warn:#8a5a00; --bad:#a33d1c;
  --font-body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace; --r:10px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:20px 60px;display:grid;gap:20px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-size:1.9rem;margin:0;color:var(--accent);text-wrap:balance}
.top-actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
#sheet-link{text-decoration:none}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
#logo{max-height:56px;max-width:160px;width:auto;object-fit:contain}
h2{font-size:1.05rem;margin:0;text-wrap:balance}
h3{font-size:.95rem;margin:0}
.sub{color:var(--cap);margin:2px 0 0;font-size:.92rem}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:999px;border:1px solid var(--line)}
.tabs button{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;font-size:.88rem;padding:6px 14px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0/.12)}
button{font-family:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:var(--r);font-weight:600;font-size:.88rem;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.small{padding:4px 10px;font-size:.8rem}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.banner{padding:10px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-size:.9rem}
.banner.warn{border-color:var(--warn)}
.banner.err{border-color:var(--bad);color:var(--bad)}
.cohorts{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.coh{display:grid;gap:4px;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:var(--r);padding:10px 12px 10px 16px;cursor:pointer;position:relative;overflow:hidden}
.coh::before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:var(--c)}
.coh[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.coh:disabled{opacity:.45;cursor:not-allowed}
.coh b{font-size:1rem}
.coh small{color:var(--muted);font-size:.78rem}
.meter{height:4px;background:var(--sunk);border-radius:2px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--c)}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:12px;border-left:4px solid var(--accent);padding:18px;display:grid;gap:18px;min-width:0}
.step{display:grid;gap:10px;min-width:0}
.step-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.num{font-family:var(--font-mono);font-size:.78rem;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 6px}
.gridwrap{overflow-x:auto;min-width:0}
table.slots{border-collapse:separate;border-spacing:4px;min-width:100%}
table.slots th{font-size:.78rem;font-weight:600;color:var(--muted);text-align:center;padding:2px 4px;white-space:nowrap}
table.slots th.t{text-align:right;font-family:var(--font-mono);padding-right:8px}
.slot{width:100%;min-width:72px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;padding:6px 4px;cursor:pointer;font-size:.8rem;display:grid;gap:1px;justify-items:center}
.slot .free{font-family:var(--font-mono);font-weight:500}
.slot small{color:var(--muted);font-size:.68rem}
.slot:hover:not(:disabled){border-color:var(--accent);background:var(--accent-l)}
.slot:disabled{cursor:not-allowed;opacity:.45;background:var(--sunk)}
.slot.sel,.slot.sel:hover{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.slot.sel small{color:inherit}
.props{display:grid;gap:8px}
.prop{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;gap:10px;background:var(--bg)}
.prop-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
label.tick{display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);flex:none}
.vtag{font-family:var(--font-mono);font-size:.78rem;font-weight:600;padding:1px 7px;border-radius:4px;background:var(--c);color:var(--cfg)}
.when{flex:1 1 220px;min-width:0}
.when .d{font-weight:600}
.when .gap{color:var(--muted);font-size:.8rem}
.prop.off .when{opacity:.5}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:.8rem;font-weight:600;color:var(--muted)}
input[type=text],input[type=email],input[type=tel],input[type=password],textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%}
textarea{min-height:60px;resize:vertical}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:.88rem;cursor:pointer}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.msg{font-size:.88rem}
.msg.ok{color:var(--ok)} .msg.err{color:var(--bad)}
.done-list{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.done-list li{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
pre.recap{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:12px;font-family:var(--font-body);font-size:.88rem;margin:0}
.reg{overflow-x:auto;min-width:0}
table.list{border-collapse:collapse;width:100%;font-size:.86rem}
table.list th,table.list td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
table.list th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);white-space:nowrap}
table.list td.code{font-family:var(--font-mono);font-weight:500;white-space:nowrap}
.chip{display:grid;font-size:.8rem;white-space:nowrap}
.chip .mono{font-size:.78rem;color:var(--muted)}
.missing{color:var(--warn);font-weight:600;font-size:.8rem}
.cell-actions{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.weekplan{display:grid;gap:16px}
.wk{display:grid;gap:6px;min-width:0}
table.day{border-collapse:separate;border-spacing:3px;min-width:100%}
table.day td,table.day th{font-size:.78rem;text-align:center}
table.day th{color:var(--muted);font-weight:600;white-space:nowrap;padding:2px 6px}
table.day th.t{font-family:var(--font-mono);text-align:right}
table.day td{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:4px;min-width:80px;font-family:var(--font-mono)}
table.day td.full{background:var(--sunk)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--surface);display:grid;gap:6px}
.kpi .v{font-size:1.7rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:.9rem;font-weight:500;color:var(--muted)}
.kpi .l{font-weight:600;font-size:.88rem}
.bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .p{background:var(--ok)} .bar .a{background:var(--bad)} .bar .b{background:var(--line)}
table.prog td{font-variant-numeric:tabular-nums;min-width:110px}
table.prog td .bar{margin-top:4px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.8rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--k)}
.daynav{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.daynav input[type=date]{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
.att{display:flex;gap:6px;flex-wrap:wrap}
.att .btn.on-p{background:var(--ok);border-color:var(--ok);color:#fff}
.att .btn.on-a{background:var(--bad);border-color:var(--bad);color:#fff}
tr.withdrawn td{opacity:.55}
tr.withdrawn td:last-child{opacity:1}
.badge-w{display:inline-block;font-size:.72rem;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--sunk);color:var(--cap);margin-top:3px}
.sites{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.site-opt{display:grid;gap:4px;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:var(--r);padding:12px 14px;cursor:pointer;font:inherit}
.site-opt b{font-size:1rem}
.site-opt small{color:var(--muted);font-size:.82rem}
.site-opt:hover{border-color:var(--accent)}
.site-opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-l);box-shadow:inset 0 0 0 1px var(--accent)}
.site-tag{display:inline-block;font-size:.72rem;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--accent-l);color:var(--cap)}
.seg{display:inline-flex;gap:4px;background:var(--sunk);padding:3px;border-radius:999px;border:1px solid var(--line)}
.seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;font-size:.8rem;padding:4px 12px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0/.12)}
.st-p{color:var(--ok);font-weight:600;font-size:.78rem}
.st-a{color:var(--bad);font-weight:600;font-size:.78rem}
.empty{color:var(--muted);font-size:.9rem;padding:8px 0}
.login{max-width:380px}
.modal{position:fixed;inset:0;background:rgb(0 0 0/.45);display:grid;place-items:center;padding:16px;z-index:10}
.modal .sheet{max-width:760px;width:100%;max-height:90vh;overflow:auto}
.loading{color:var(--muted)}
@media (max-width:520px){.sheet{padding:14px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <img id="logo" alt="" hidden>
      <div>
      <h1 id="title"></h1>
      <p class="sub" id="subtitle"></p>
      </div>
    </div>
    <div class="top-actions">
    <div class="tabs" role="tablist" id="tabs" hidden>
      <button role="tab" data-tab="book" aria-selected="true">Inscrire</button>
      <button role="tab" data-tab="reg" aria-selected="false">Volontaires</button>
      <button role="tab" data-tab="plan" aria-selected="false">Planning</button>
      <button role="tab" data-tab="suivi" aria-selected="false">Suivi</button>
    </div>
    <a id="sheet-link" class="btn small" target="_blank" rel="noopener" hidden>Ouvrir le Google Sheet ↗</a>
    </div>
  </header>
  <div id="status" class="banner" hidden></div>
  <section id="coh-section" hidden>
    <div class="label" style="margin-bottom:6px" id="coh-label">Cohorte</div>
    <div class="cohorts" id="cohorts"></div>
  </section>
  <main id="view"><p class="loading">Chargement des créneaux…</p></main>
</div>

<div id="modal-root"></div>

<script>
/* =====================================================================
   RÉGLAGE : collez ici le lien de votre application Apps Script (celui qui se termine par /exec)
   ===================================================================== */
const API_URL = "https://script.google.com/macros/s/AKfycbzB6lC_hsEvLvQdUDrh_Kfeb6u4Qbt_dykFclGddcRS4LWFyWN2WVWFuD7bmHyoUizZ4Q/exec";

async function call(fn,...args){
  let r;
  try{ r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({fn,args})}); }
  catch(e){ throw new Error("Connexion impossible. Vérifiez votre connexion internet et réessayez."); }
  let j; try{ j=await r.json(); }catch(e){ throw new Error("Réponse inattendue du serveur."); }
  if(!j.ok) throw new Error(j.error||"Erreur inconnue.");
  return j.result;
}
let BOOT;
(async function(){
  const q=new URLSearchParams(location.search);
  const page=q.get("page");
  const mode=page==="equipe"?"equipe":(page==="rdv"||q.get("code"))?"rdv":"public";
  if(API_URL.indexOf("http")!==0){document.getElementById("view").innerHTML='<div class="banner err">Réglage manquant : collez le lien /exec dans API_URL (en haut du script de index.html).</div>';return;}
  try{ BOOT=await call("getConfig"); }
  catch(e){ document.getElementById("view").innerHTML='<div class="banner err"></div>'; document.querySelector("#view .banner").textContent="Impossible de charger le planning : "+e.message; return; }
  BOOT.mode=mode; BOOT.pid=(q.get("code")||"").slice(0,30); BOOT.tok=(q.get("t")||"").slice(0,64);
  document.title=BOOT.study+(mode==="equipe"?" · Équipe":mode==="rdv"?" · Mes rendez-vous":" · Inscription");
  main();
})();

function main(){
const MODE = BOOT.mode;            // "public" (volontaires) ou "equipe"
const COHORTS = BOOT.cohorts, TIMES = BOOT.times, CAP = BOOT.cap, PER_COHORT = BOOT.perCohort || 50, PER_DAY = BOOT.perDay || 10;
const VISITS = ["M0","M1","M3","M8"], FOLLOW = ["M1","M3","M8"];

let occ = {}, counts = {}, today = BOOT.today;
let pw = null, data = null;         // équipe
let cur = null, tab = "book", draft = null, result = null, busy = false;

/* ---------- utilitaires ---------- */
const $ = (s,el=document)=>el.querySelector(s);
function h(tag,attrs={},...kids){const e=document.createElement(tag);for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;if(k==="class")e.className=v;else if(k==="text")e.textContent=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?"":v);}for(const kid of kids.flat()){if(kid==null||kid===false)continue;e.append(kid instanceof Node?kid:document.createTextNode(kid));}return e;}
const toDate=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);};
const fmtShort=s=>toDate(s).toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"});
const fmtLong=s=>toDate(s).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
const fmtRange=a=>{const o={day:"numeric",month:"short"};return toDate(a[0]).toLocaleDateString("fr-FR",o)+" – "+toDate(a[a.length-1]).toLocaleDateString("fr-FR",{...o,year:"numeric"});};
const daysFrom=(a,b)=>Math.round((toDate(b)-toDate(a))/864e5);
const weeksBetween=(a,b)=>Math.round((toDate(b)-toDate(a))/(7*864e5));
const key=(d,t)=>d+"_"+t;
function errText(e){return String((e&&e.message)||e).replace(/^(Exception|Error):\s*/,"");}
function status(text,kind){const s=$("#status");s.textContent=text||"";s.className="banner "+(kind||"");s.hidden=!text;}
/* Lieux : chaque lieu a sa propre capacité. SITE = lieu des grilles affichées en ce moment. */
const SITES=BOOT.sites||{};
let SITE=null, planSite=null, suiviSite="";
const cohortSites=c=>(COHORTS[c]&&COHORTS[c].sites)||Object.keys(SITES).slice(0,1);
const siteName=k=>(SITES[k]&&SITES[k].name)||k||"";
const siteAddr=k=>SITES[k]?(SITES[k].address||SITES[k].name+" (adresse communiquée prochainement)"):"";
function freeAt(date,time,taken=[]){
  const slot=(occ[SITE+"|"+key(date,time)]||0)+taken.filter(x=>x&&x.date===date&&x.time===time).length;
  const day=(occ[SITE+"|"+date]||0)+taken.filter(x=>x&&x.date===date).length;
  return Math.max(0,Math.min(CAP-slot,PER_DAY-day));
}
const perCohort=()=>PER_COHORT;
function vtag(c,v){return h("span",{class:"vtag",style:`--c:${COHORTS[c].color};--cfg:${COHORTS[c].fg}`,text:v});}
function field(label,id,input){return h("div",{class:"field"},h("label",{for:id,text:label}),input);}
const isOpen=c=>MODE==="equipe"||COHORTS[c].v.M0[COHORTS[c].v.M0.length-1]>today;

/* Proposition : même jour de la semaine et même heure que M0, sinon le créneau libre le plus proche */
function propose(c,visit,m0,taken){
  const days=COHORTS[c].v[visit], m0days=COHORTS[c].v.M0;
  const di=Math.max(0,m0days.indexOf(m0.date)), ti=Math.max(0,TIMES.indexOf(m0.time));
  const cands=[];
  days.forEach((d,i)=>TIMES.forEach((t,j)=>cands.push({date:d,time:t,score:Math.abs(i-di)*10+Math.abs(j-ti)})));
  cands.sort((a,b)=>a.score-b.score);
  const f=cands.find(x=>freeAt(x.date,x.time,taken)>0);
  return f?{date:f.date,time:f.time}:null;
}

/* ---------- démarrage ---------- */
$("#title").textContent=BOOT.study+(MODE==="equipe"?" · Équipe":"");
if(BOOT.logo){const l=$("#logo");l.src=BOOT.logo;l.alt=BOOT.study;l.hidden=false;l.onerror=()=>{l.hidden=true;};}
$("#subtitle").textContent=MODE==="rdv"?"Vos rendez-vous pour l'étude. Vous pouvez changer un horaire jusqu'à "+BOOT.deadline+" jours avant la visite.":MODE==="equipe"
  ?"7 cohortes · visites M0, M1, M3, M8 · "+PER_DAY+" volontaires par jour · "+PER_COHORT+" par cohorte · 1 h 30 par visite"
  :"Inscrivez-vous à votre première visite (M0). Les visites suivantes (M1, M3 et M8) vous sont proposées automatiquement.";
document.querySelectorAll("#tabs button").forEach(b=>b.addEventListener("click",()=>{tab=b.dataset.tab;document.querySelectorAll("#tabs button").forEach(x=>x.setAttribute("aria-selected",String(x===b)));render();}));
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#modal-root").replaceChildren();});

let mine=null;
async function start(){
  if(MODE==="equipe"){renderLogin();return;}
  if(MODE==="rdv"){
    try{mine=await call("getMine",BOOT.pid,BOOT.tok);occ=mine.occ;today=mine.today;cur=mine.cohort;render();}
    catch(e){status(errText(e),"err");$("#view").replaceChildren();}
    return;
  }
  try{const a=await call("getAvailability");occ=a.occ;counts=a.counts;today=a.today;}
  catch(e){status("Impossible de charger les créneaux : "+errText(e),"err");return;}
  cur=Object.keys(COHORTS).find(c=>isOpen(c)&&(counts[c]||0)<perCohort())||null;
  render();
}
function applyData(d){if(d.sheetUrl){const a=$("#sheet-link");a.href=d.sheetUrl;a.hidden=false;}data=d;occ=d.occ;today=d.today;counts={};d.people.forEach(p=>counts[p.cohort]=(counts[p.cohort]||0)+1);}

/* ---------- connexion équipe ---------- */
function renderLogin(){
  const msg=h("span",{class:"msg"});
  const inp=h("input",{type:"password",id:"pw",autocomplete:"current-password"});
  const go=async()=>{msg.className="msg";msg.textContent="Vérification…";
    try{applyData(await call("adminData",inp.value));pw=inp.value;$("#tabs").hidden=false;cur=cur||"C1";render();}
    catch(e){msg.className="msg err";msg.textContent=errText(e);}};
  inp.addEventListener("keydown",e=>{if(e.key==="Enter")go();});
  $("#view").replaceChildren(h("div",{class:"sheet login"},h("h2",{text:"Accès équipe"}),field("Mot de passe","pw",inp),h("div",{class:"actions"},h("button",{class:"btn primary",onclick:go},"Ouvrir"),msg)));
  setTimeout(()=>inp.focus(),50);
}

/* ---------- rendu ---------- */
function render(){
  if(MODE==="rdv"){$("#view").replaceChildren(viewMine());return;}
  if(tab==="suivi"){$("#coh-section").hidden=true;$("#view").replaceChildren(viewSuivi());return;}
  renderCohorts();
  const v=$("#view");
  if(!cur){v.replaceChildren(h("div",{class:"sheet"},h("p",{class:"empty",text:"Aucune cohorte n'est ouverte aux inscriptions pour le moment."+(BOOT.contact?" Contact : "+BOOT.contact:"")})));return;}
  v.replaceChildren(tab==="book"?viewBook():tab==="reg"?viewReg():viewPlan());
}
function renderCohorts(){
  $("#coh-section").hidden=false;
  $("#coh-label").textContent=MODE==="equipe"?"Cohorte":"Choisissez votre période de première visite";
  const box=$("#cohorts");box.replaceChildren();
  for(const c in COHORTS){
    const n=counts[c]||0, full=MODE!=="equipe"&&n>=perCohort(), open=isOpen(c);
    const note=!open?"terminée":full?"complète":MODE==="equipe"?`${n} / ${perCohort()} inscrits`:`${perCohort()-n} places`;
